<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Классификатор инцидентов</title>
  <meta name="description" content="Подбор группы тем и темы по классификатору инцидентов: описания, «не путать с темами», поиск.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233f3444'/%3E%3Cpath d='M9 11h14M9 16h14M9 21h9' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css?v=5">
  <script>
    try { var t = localStorage.getItem('klassiki-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Список групп" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <a class="brand" href="#/">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-text">Классификатор<span class="brand-sub"> инцидентов</span></span>
    </a>
    <div class="search">
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="q" type="search" autocomplete="off" spellcheck="false"
             placeholder="Поиск по темам и описаниям…" aria-label="Поиск по темам">
      <kbd class="search-kbd" aria-hidden="true">/</kbd>
    </div>
    <a class="icon-btn notes-btn" id="notesBtn" href="#/notes" title="Примечания коллег" aria-label="Примечания" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/><path d="M8.5 10.5h7M8.5 13.5h4.5"/></svg>
      <span class="notes-btn-text">Примечания</span>
      <span class="badge" id="notesBadge" hidden></span>
    </a>
    <button class="icon-btn" id="themeBtn" aria-label="Сменить тему оформления">
      <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
    </button>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="Группы тем"></nav>
    <div class="scrim" id="scrim"></div>
    <main class="main" id="view" tabindex="-1">
      <noscript><p class="empty">Для работы сайта нужен включённый JavaScript.</p></noscript>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <button class="to-top" id="toTop" aria-label="Наверх">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 14 6-6 6 6"/></svg>
  </button>

  <script src="data.js?v=0572da52"></script>
  <script src="config.js?v=1"></script>
  <script src="app.js?v=5"></script>
</body>
</html>
