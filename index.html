<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подбор группы и темы</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>📋 Подбор группы тем и темы</h1>

        <p class="stats" id="stats"></p>

        <div class="search-block">
            <input type="text" id="searchInput" placeholder="🔍 Поиск по теме или группе...">
        </div>

        <div class="section">
            <h2>1. Выберите группу тем</h2>
            <div id="groupsList" class="list"></div>
        </div>

        <div class="section" id="topicsSection" style="display: none;">
            <h2>2. Выберите тему</h2>
            <div id="topicsList" class="list"></div>
        </div>

        <div class="section" id="resultSection" style="display: none;">
            <h2>3. Результат</h2>
            <div class="result-box">
                <p><strong>Группа:</strong> <span id="selectedGroup"></span></p>
                <p><strong>Тема:</strong> <span id="selectedTopic"></span></p>
                <p><strong>Описание:</strong> <span id="selectedDescription"></span></p>
                <button id="copyGroupBtn" class="btn">📋 Копировать группу</button>
                <button id="copyTopicBtn" class="btn">📋 Копировать тему</button>
                <button id="copyBothBtn" class="btn btn-green">📋 Копировать всё</button>
            </div>
            <div id="copyNotification" class="notification"></div>
        </div>
    </div>

    <button id="scrollTopBtn" class="scroll-top" title="Наверх">↑</button>

    <script src="script.js"></script>
</body>
</html>
